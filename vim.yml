---
# Minimal selene standard library for the Neovim API surface picked uses.
base: lua51
globals:
  vim:
    any: true
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  before_each:
    args:
      - type: function
  after_each:
    args:
      - type: function
  assert:
    any: true
